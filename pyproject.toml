[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ks-statistics"
version = "0.1.0"
description = "CLI no interactiva para estadisticas de Kickstarter (Video Games, Mexico, funded-successful)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "cloudscraper>=1.2.71",
  "typer>=0.16.0",
  "rich>=13.7.0",
  "plotext>=5.3.2",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
ks-stats = "ks_stats.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
